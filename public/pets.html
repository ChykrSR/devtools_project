<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการประวัติสัตว์เลี้ยง - Pet Care Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- Navigation Bar -->
  <nav class="bg-teal-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="dashboard.html" class="text-teal-200 hover:text-white flex items-center text-sm mr-2 transition">
            ← กลับหน้าหลัก
          </a>
          <span class="text-2xl">🐾</span>
          <span class="font-bold text-lg hidden sm:inline">จัดการประวัติสัตว์เลี้ยง (UC-02)</span>
        </div>
        <div class="flex items-center space-x-3">
          <span id="nav-user-name" class="text-sm font-medium">กำลังโหลด...</span>
          <button onclick="handleLogout()" class="bg-teal-800 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg transition">
            ออกจากระบบ
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Header Actions -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">สัตว์เลี้ยงของฉัน</h1>
        <p class="text-slate-500 text-sm mt-0.5">เพิ่ม แก้ไข หรือดูข้อมูลสุขภาพสัตว์เลี้ยงทั้งหมดของคุณ</p>
      </div>
      <button onclick="openPetModal()" class="bg-teal-600 hover:bg-teal-700 text-white font-medium px-4 py-2.5 rounded-xl transition flex items-center space-x-2 shadow-sm">
        <span>+ เพิ่มสัตว์เลี้ยงใหม่</span>
      </button>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden p-4 rounded-xl text-sm font-medium"></div>

    <!-- Pets Grid (แสดงการ์ดรายการสัตว์เลี้ยง) -->
    <div id="pets-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-slate-400">กำลังโหลดข้อมูล...</div>
    </div>

  </main>

  <!-- Modal สำหรับ เพิ่ม / แก้ไข สัตว์เลี้ยง -->
  <div id="pet-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
      
      <!-- Modal Header -->
      <div class="bg-teal-700 text-white px-6 py-4 flex justify-between items-center">
        <h3 id="modal-title" class="font-bold text-lg">เพิ่มสัตว์เลี้ยงใหม่</h3>
        <button onclick="closePetModal()" class="text-teal-200 hover:text-white text-2xl font-bold">&times;</button>
      </div>

      <!-- Modal Form -->
      <form id="pet-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="pet-id" value="">

        <div>
          <label class="block text-sm font-medium text-slate-700">ชื่อสัตว์เลี้ยง <span class="text-red-500">*</span></label>
          <input type="text" id="pet-name" required placeholder="เช่น โคล่า" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700">ประเภท <span class="text-red-500">*</span></label>
            <select id="pet-type" required class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm bg-white">
              <option value="dog">สุนัข 🐶</option>
              <option value="cat">แมว 🐱</option>
              <option value="bird">นก 🦜</option>
              <option value="rabbit">กระต่าย 🐰</option>
              <option value="other">อื่นๆ 🐾</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">สายพันธุ์</label>
            <input type="text" id="pet-breed" placeholder="เช่น โกลเด้น" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-700">อายุ</label>
            <input type="text" id="pet-age" placeholder="เช่น 2 ปี" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">เพศ</label>
            <select id="pet-gender" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm bg-white">
              <option value="male">ผู้ ♂</option>
              <option value="female">เมีย ♀</option>
              <option value="unknown">ไม่ระบุ</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">น้ำหนัก (กก.)</label>
            <input type="number" step="0.01" id="pet-weight" placeholder="0.00" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">บันทึกเพิ่มเติม / ประวัติแพ้ยา</label>
          <textarea id="pet-notes" rows="2" placeholder="เช่น แพ้อาหารทะเล, ทำหมันแล้ว" class="mt-1 w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm"></textarea>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end space-x-3 pt-4 border-t">
          <button type="button" onclick="closePetModal()" class="px-4 py-2 border rounded-xl text-slate-600 hover:bg-slate-100 text-sm">ยกเลิก</button>
          <button type="submit" class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-medium text-sm transition">บันทึกข้อมูล</button>
        </div>
      </form>

    </div>
  </div>

  <script src="pets.js"></script>
</body>
</html>
