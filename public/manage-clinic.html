<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการคลินิกและผู้ใช้งาน - Pet Care Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- Navbar -->
  <nav class="bg-teal-700 text-white shadow-md p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="dashboard.html" class="text-teal-200 hover:text-white text-sm">← กลับหน้าหลัก</a>
      <h1 class="font-bold text-lg">ระบบบริหารจัดการคลินิก (UC-11)</h1>
      <span id="nav-user-name" class="text-xs bg-teal-800 px-3 py-1 rounded-full">Admin</span>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    
    <!-- Tab Controls -->
    <div class="flex space-x-2 border-b border-slate-200 mb-6">
      <button id="tab-btn-clinic" onclick="switchTab('clinic')" class="px-5 py-2.5 font-semibold text-sm border-b-2 border-teal-600 text-teal-700 transition">
        🏥 ข้อมูลทั่วไปของคลินิก
      </button>
      <button id="tab-btn-users" onclick="switchTab('users')" class="px-5 py-2.5 font-semibold text-sm text-slate-500 hover:text-slate-700 transition">
        👥 จัดการผู้ใช้งาน & บุคลากร
      </button>
    </div>

    <!-- TAB 1: CLINIC INFO -->
    <section id="tab-clinic" class="bg-white rounded-2xl shadow-sm border p-6">
      <h2 class="text-xl font-bold mb-4 text-slate-800">รายละเอียดคลินิก</h2>
      <form id="clinic-form" onsubmit="handleUpdateClinic(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">ชื่อคลินิก *</label>
          <input type="text" id="clinic-name" required class="mt-1 w-full p-2.5 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">ที่อยู่</label>
          <textarea id="clinic-address" rows="2" class="mt-1 w-full p-2.5 border rounded-lg text-sm"></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700">เบอร์โทรศัพท์</label>
            <input type="text" id="clinic-phone" class="mt-1 w-full p-2.5 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">อีเมล</label>
            <input type="email" id="clinic-email" class="mt-1 w-full p-2.5 border rounded-lg text-sm">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700">เลขประจำตัวผู้เสียภาษี (Tax ID)</label>
            <input type="text" id="clinic-tax-id" class="mt-1 w-full p-2.5 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">เวลาทำการ</label>
            <input type="text" id="clinic-opening-hours" class="mt-1 w-full p-2.5 border rounded-lg text-sm">
          </div>
        </div>
        <div class="pt-4 border-t flex justify-end">
          <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition">
            💾 บันทึกข้อมูลคลินิก
          </button>
        </div>
      </form>
    </section>

    <!-- TAB 2: USER MANAGEMENT -->
    <section id="tab-users" class="hidden space-y-4">
      <!-- Search & Filter Bar -->
      <div class="flex flex-col md:flex-row gap-3 items-center justify-between bg-white p-4 rounded-2xl border shadow-sm">
        <div class="flex flex-1 gap-2 w-full md:w-auto">
          <input type="text" id="user-search" oninput="debounceSearch()" placeholder="🔍 ค้นหาชื่อ, อีเมล, เบอร์โทร..." class="w-full md:w-64 p-2 border rounded-xl text-sm">
          <select id="user-role-filter" onchange="loadUsers()" class="p-2 border rounded-xl text-sm bg-white">
            <option value="all">ทุกบทบาท (All Roles)</option>
            <option value="pet_owner">🐶 Pet Owner</option>
            <option value="vet">🩺 Vet</option>
            <option value="staff">📋 Staff</option>
            <option value="admin">⚙️ Admin</option>
          </select>
        </div>
        <button onclick="openUserModal()" class="w-full md:w-auto bg-teal-600 hover:bg-teal-700 text-white text-sm px-4 py-2 rounded-xl transition font-medium">
          ➕ เพิ่มผู้ใช้งานใหม่
        </button>
      </div>

      <!-- User Table -->
      <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b">
              <th class="p-4">ID</th>
              <th class="p-4">ชื่อ - นามสกุล</th>
              <th class="p-4">อีเมล / เบอร์โทร</th>
              <th class="p-4">บทบาท (Role)</th>
              <th class="p-4">สถานะ</th>
              <th class="p-4 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="user-table-body" class="divide-y divide-slate-100 text-sm">
            <tr><td colspan="6" class="p-8 text-center text-slate-400">กำลังโหลดข้อมูลผู้ใช้...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- MODAL: ADD/EDIT USER -->
  <div id="user-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="user-modal-title" class="font-bold text-slate-800">เพิ่มผู้ใช้งานใหม่</h3>
        <button onclick="closeUserModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <form id="user-form" onsubmit="handleUserSubmit(event)" class="space-y-3 mt-4">
        <input type="hidden" id="user-id">

        <div>
          <label class="block text-xs font-medium text-slate-700">ชื่อ - นามสกุล *</label>
          <input type="text" id="user-fullname" required class="mt-1 w-full p-2 border rounded-lg text-sm">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700">อีเมล *</label>
          <input type="email" id="user-email" required class="mt-1 w-full p-2 border rounded-lg text-sm">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700">เบอร์โทรศัพท์</label>
          <input type="text" id="user-phone" class="mt-1 w-full p-2 border rounded-lg text-sm">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-700">บทบาท (Role) *</label>
            <select id="user-role" required class="mt-1 w-full p-2 border rounded-lg text-sm bg-white">
              <option value="pet_owner">🐶 Pet Owner</option>
              <option value="vet">🩺 Vet</option>
              <option value="staff">📋 Staff</option>
              <option value="admin">⚙️ Admin</option>
            </select>
          </div>
          <div id="status-field-group">
            <label class="block text-xs font-medium text-slate-700">สถานะ *</label>
            <select id="user-is-active" class="mt-1 w-full p-2 border rounded-lg text-sm bg-white">
              <option value="1">🟢 ใช้งานปกติ</option>
              <option value="0">🔴 ระงับใช้งาน</option>
            </select>
          </div>
        </div>

        <div id="password-field-group">
          <label class="block text-xs font-medium text-slate-700">รหัสผ่าน *</label>
          <input type="password" id="user-password" class="mt-1 w-full p-2 border rounded-lg text-sm">
        </div>

        <div class="pt-4 flex justify-end space-x-2">
          <button type="button" onclick="closeUserModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-medium">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <script src="manage-clinic.js"></script>
</body>
</html>
